<!DOCTYPE html>
<html lang="en">
<head>

<title>Presentations — Red Hat OpenShift AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Red Hat Display',sans-serif;background:#151515;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 24px}
h1{font-size:32px;font-weight:900;margin-bottom:6px}
.subtitle{color:#a3a3a3;font-size:15px;margin-bottom:40px}
.accent{color:#ee0000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;width:100%;max-width:900px}
a.card{display:block;background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:24px;text-decoration:none;color:#fff;transition:border-color .15s}
a.card:hover{border-color:#ee0000}
.card-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ee0000;margin-bottom:8px}
.card h2{font-size:18px;font-weight:700;margin-bottom:6px}
.card p{font-size:13px;color:#a3a3a3;line-height:1.5}
.card .date{font-size:11px;color:#6a6e73;margin-top:10px}
footer{margin-top:auto;padding:40px 0 20px;text-align:center;font-size:11px;color:#6a6e73}
</style>
</head>
<body>
<h1>Presentations<span class="accent">.</span></h1>
<p class="subtitle">Red Hat OpenShift AI</p>

<div class="grid">
  <a class="card" href="mcp-architecture/">
    <span class="card-tag">MCP</span>
    <h2>MCP Hub-Spoke Architecture</h2>
    <p>Giving AI agents safe access to OpenShift clusters at fleet scale. MCP Gateway, Keycloak auth, RHACM multi-cluster, GitOps.</p>
    <div class="date">11 slides</div>
  </a>
</div>

<footer>Confidential: Red Hat associate and NDA partner use only</footer>
</body>
